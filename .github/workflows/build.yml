name: Build installers

# Builds unsigned installers for macOS (arm64 + x64 .dmg and .zip, ad-hoc signed) and Windows (.exe),
# then publishes GitHub Release v<package.json version> with latest.json — the installed apps find it
# and offer "Update and restart". Bump "version" in package.json before running (the job refuses to
# overwrite an existing release). Manual only: Actions → Build installers → Run workflow.
# Release files are public (public repo) and contain the Google OAuth desktop client ID/secret;
# Google treats a desktop client secret as not confidential, see README.
on:
  workflow_dispatch:
    inputs:
      notes:
        description: "What's new (shown in the app's update banner; optional)"
        required: false
        default: ''

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build installers
        run: npm run dist
        env:
          # Google OAuth "Desktop app" client. Add these in GitHub → Settings → Secrets and variables → Actions.
          MAIN_VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          MAIN_VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          # Never try to find a signing certificate or publish.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: mail-assistant-${{ matrix.os }}
          path: |
            release/*.dmg
            release/*-mac.zip
            release/*-Setup.exe
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      NOTES: ${{ inputs.notes }}
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: v
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing release
        run: |
          if gh release view "v${{ steps.v.outputs.version }}" > /dev/null 2>&1; then
            echo "Release v${{ steps.v.outputs.version }} already exists. Bump the version in package.json first."
            exit 1
          fi

      - uses: actions/download-artifact@v4
        with:
          path: dist-all
          merge-multiple: true

      - name: Write latest.json
        run: node scripts/make-manifest.mjs dist-all "${{ steps.v.outputs.version }}" "$NOTES" > dist-all/latest.json

      - name: Publish release
        run: |
          gh release create "v${{ steps.v.outputs.version }}" dist-all/* --title "Mail Assistant ${{ steps.v.outputs.version }}" --notes "${NOTES:-Mail Assistant ${{ steps.v.outputs.version }}}"

